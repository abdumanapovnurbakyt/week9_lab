x-app: &app
  build: .
  image: lab6-tsdb
  environment:
    PGHOST: timescaledb
    PGPORT: "5432"
    PGUSER: postgres
    PGPASSWORD: postgres
    PGDATABASE: lab6
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
    MINIO_BUCKET: telemetry-cold

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lab6
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - jit=off
      - -c
      - max_parallel_workers_per_gather=2
      - -c
      - timescaledb.telemetry_level=off
    shm_size: 1gb
    ports:
      - "5432:5432"
    volumes:
      - tsdb-data:/var/lib/postgresql/data
      - ./sql/00_init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab6"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # образ minio/minio удалён из Docker Hub, поэтому MinIO собирается из исходников (docker/minio/Dockerfile)
    build: ./docker/minio
    image: lab6-minio:local
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  bench:
    <<: *app
    entrypoint: ["python", "-m", "tsdb.bench"]
    volumes:
      - ./results:/app/results
    depends_on:
      timescaledb:
        condition: service_healthy
      minio:
        condition: service_started
    profiles: ["tools"]

  tests:
    <<: *app
    entrypoint: ["python", "tests.py"]
    depends_on:
      timescaledb:
        condition: service_healthy
      minio:
        condition: service_started
    profiles: ["tools"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/telemetry.json
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    profiles: ["viz"]

volumes:
  tsdb-data:
  minio-data:
